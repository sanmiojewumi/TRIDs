services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ninted
      POSTGRES_PASSWORD: ninted
      POSTGRES_DB: ninted
    ports:
      - "5432:5432"
    volumes:
      - ninted_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninted"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ninted_pg:
