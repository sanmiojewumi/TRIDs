<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Thumb Desk</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="brand">TRIDS</p>
        <h1>Thumb Desk</h1>
      </div>
      <p id="folder" class="folder">Internal storage/TRIDS APPS/Thumb Desk</p>
      <button id="change-folder" type="button">Change folder</button>
    </header>

    <main id="home">
      <button id="open" class="primary" type="button">Open document or image</button>
      <input id="open-file" type="file" accept="image/*,application/pdf" hidden />
      <section>
        <h2>Thumbprints</h2>
        <p class="lead">Add a print for each person. You can put more than one on the same page.</p>
        <label class="field">Name <input id="thumb-name" type="text" maxlength="40" placeholder="For example, Client" /></label>
        <label class="check"><input id="lift" type="checkbox" checked /> Lift the print off white paper</label>
        <div class="row">
          <button id="add-photo" type="button">Add from photos</button>
          <button id="add-camera" type="button">Take photo</button>
        </div>
        <input id="thumb-file" type="file" accept="image/*" hidden />
        <input id="thumb-camera" type="file" accept="image/*" capture="environment" hidden />
        <ul id="thumbs"></ul>
      </section>
    </main>

    <section id="editor" hidden>
      <div class="editor-bar">
        <button id="back" type="button">Back</button>
        <p id="doc-name"></p>
        <button id="save" class="primary" type="button">Save</button>
      </div>
      <div class="pager">
        <button id="prev" type="button">Previous</button>
        <span id="page-label">Page 1 of 1</span>
        <button id="next" type="button">Next</button>
      </div>
      <div id="stage" class="stage">
        <img id="page-img" alt="The page you are stamping" />
        <div id="overlay"></div>
      </div>
      <div class="sheet">
        <p id="hint">Choose a thumbprint, then tap the page to place it.</p>
        <div id="thumb-strip" class="strip"></div>
        <label class="field">Size <input id="size" type="range" min="8" max="70" value="22" /></label>
        <label class="field">Turn <input id="turn" type="range" min="-180" max="180" value="0" /></label>
        <button id="remove-stamp" type="button">Remove this print</button>
      </div>
    </section>

    <p id="status" role="status"></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
